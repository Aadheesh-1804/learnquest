  <main class="layout">

    <!-- Chalkboard: form side -->
    <section class="panel">
      <div class="chalk">
        <header class="chalk-top">
          <a class="logo" href="login.html">LearnQuest</a>
          <nav class="chalk-nav">
            <a href="login.html" aria-current="page">Log in</a>
            <a href="register.html">Sign up</a>
          </nav>
        </header>

        <div class="form-area">
          <h1>Welcome back!</h1>
          <p class="intro">Log in to continue your quizzes and see your points.</p>

          <!-- Connect to your Spring Boot API later, e.g. POST /auth/login -->
          <form action="#" method="post">
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
            </div>

            <div class="row">
              <label><input type="checkbox" name="remember"> Remember me</label>
              <a href="forgot-password.html">Forgot password?</a>
            </div>

            <p class="form-error" id="loginError" hidden></p>

            <button type="submit" class="btn">Log in</button>
          </form>

          <p class="switch">New here? <a href="register.html">Join the class</a></p>
        </div>

        <div class="chalk-foot" aria-hidden="true"><i class="stick"></i><i class="stick"></i><i class="stick"></i></div>
      </div>
    </section>
